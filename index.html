<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phrase Detective Italiano</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Phrase Detective</h1>

    <table id="layout-table">
        <tr>
            <td>
                <div id="grid"></div>
            </td>
        </tr>
    </table>

    <div id="controls">

        <button id="btn-shuffle">
            Rimescola
        </button>

        <label for="difficulty">
            Difficoltà
        </label>

        <select id="difficulty">
            <option value="facile">Facile</option>
            <option value="media">Media</option>
            <option value="difficile">Difficile</option>
        </select>

        <button id="btn-new">
            Nuova frase
        </button>

    </div>

    <div id="message"></div>

    <div id="legend">

        <div class="legend-item">
            <div class="legend-color correct"></div>
            Corretta
        </div>

        <div class="legend-item">
            <div class="legend-color very-close"></div>
            Vicinissima
        </div>

        <div class="legend-item">
            <div class="legend-color close"></div>
            Vicina
        </div>

        <div class="legend-item">
            <div class="legend-color far"></div>
            Lontana
        </div>

        <div class="legend-item">
            <div class="legend-color very-far"></div>
            Lontanissima
        </div>

    </div>

    <!-- Archivio delle frasi -->
    <script src="frasi.js"></script>

    <!-- Logica del gioco -->
    <script src="script.js"></script>

</body>
</html>
