<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Phrase Detective Italiano</title>

<style>
  body {
    background: #1b1f2b;
    color: #eee;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
  }

  #layout-table {
    margin: 0 auto;
    border-collapse: collapse;
  }

  #layout-table td {
    width: 90%;
    margin: 0 auto;
  }

  #grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    margin-top: 20px;
  }

  .cell {
    width: 52px;
    height: 52px;
    background: #333;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    font-weight: bold;
    cursor: pointer;
    transition: outline 0.1s, background 0.2s;
  }

  .selected {
    outline: 2px solid #facc15;
  }

  /* ★★★ SEPARATORE CELESTINO ★★★ */
.separator {
    font-size: 46px;          
    color: #4fc3f7;           /* celestino brillante */
    margin: 0 22px;           
    line-height: 52px;        
    user-select: none;        
    pointer-events: none;     
    font-weight: bold;        
    text-shadow:
        0 0 6px #ffffff,      /* bagliore bianco morbido */
        0 0 12px #ffffff;     /* bagliore bianco più largo */
}


  #controls {
    margin-top: 20px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }

  button {
    background: #3b82f6;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
  }

  #message {
    margin-top: 20px;
    font-size: 18px;
  }

  #legend {
    margin-top: 30px;
    font-size: 15px;
    display: flex;
    justify-content: center;
    gap: 20px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .legend-color {
    width: 20px;
    height: 20px;
    border-radius: 4px;
  }
</style>

</head>
<body>

<h1>Phrase Detective</h1>

<table id="layout-table">
  <tr>
    <td>
      <div id="grid"></div>
    </td>
  </tr>
</table>

<div id="controls">
  <button id="btn-shuffle">Rimescola</button>
</div>

<div id="message"></div>

<div id="legend">
  <div class="legend-item">
    <div class="legend-color" style="background:#2b7a3f;"></div> Corretta
  </div>
  <div class="legend-item">
    <div class="legend-color" style="background:#c9a92c;"></div> Vicinissima
  </div>
  <div class="legend-item">
    <div class="legend-color" style="background:#c97a2c;"></div> Vicina
  </div>
  <div class="legend-item">
    <div class="legend-color" style="background:#a83232;"></div> Lontana 
  </div>
  <div class="legend-item">
    <div class="legend-color" style="background:#5a3b1e;"></div> Lontanissima
  </div>
</div>

<script>
  const phraseOriginal = "Non c'è cosa più divina che giocare con Yasmina";

  const phraseNoSpaces = Array.from(phraseOriginal.replace(/ /g, "")).map((ch, i) => ({
    char: ch,
    id: i
  }));

  const wordLengths = phraseOriginal.split(" ").map(w => Array.from(w).length);

  let letters = phraseNoSpaces.map(obj => ({ ...obj }));
  let selectedIndex = null;

  const grid = document.getElementById("grid");
  const message = document.getElementById("message");

  function initialShuffle() {
    let ok = false;

    while (!ok) {
      let shuffled = letters
        .map(v => ({ v, sort: Math.random() }))
        .sort((a, b) => a.sort - b.sort)
        .map(o => o.v);

      const anyCorrect = shuffled.some((obj, i) => obj.id === phraseNoSpaces[i].id);

      if (!anyCorrect) {
        letters = shuffled;
        ok = true;
      }
    }
  }

  function shuffle() {
    const wrong = letters.filter((obj, i) => obj.id !== phraseNoSpaces[i].id);

    const shuffled = wrong
      .map(v => ({ v, sort: Math.random() }))
      .sort((a, b) => a.sort - b.sort)
      .map(o => o.v);

    let idx = 0;
    letters = letters.map((obj, i) => {
      if (obj.id === phraseNoSpaces[i].id) return obj;
      return shuffled[idx++];
    });

    render();
  }

  initialShuffle();

  function distanceColor(index) {
    const correctObj = phraseNoSpaces[index];

    if (letters[index].id === correctObj.id) return "#00c853";

    const positions = phraseNoSpaces
      .map((obj, i) => obj.id === letters[index].id ? i : null)
      .filter(i => i !== null);

    if (positions.length === 0) return "#5a3b1e";

    let min = Infinity;
    for (const p of positions) {
      const d = Math.abs(index - p);
      if (d < min) min = d;
    }

    if (min <= 3) return "#c9a92c";
    if (min <= 6) return "#c97a2c";
    if (min <= 12) return "#a83232";
    return "#5a3b1e";
  }

  function render() {
    grid.innerHTML = "";

    let nextWordEnd = wordLengths[0];
    let wordIndex = 1;

    letters.forEach((obj, i) => {

      /* ★★★ SEPARATORE TRA PAROLE ★★★ */
      if (i === nextWordEnd - wordLengths[wordIndex - 1] && i !== 0) {
        const sep = document.createElement("div");
        sep.className = "separator";
        sep.textContent = "•";
        grid.appendChild(sep);
      }

      const cell = document.createElement("div");
      cell.className = "cell";
      cell.textContent = obj.char;
      cell.style.background = distanceColor(i);

      if (letters[i].id === phraseNoSpaces[i].id) {
        cell.style.pointerEvents = "none";
        cell.style.color = "#fff";
      }

      if (selectedIndex === i) {
        cell.classList.add("selected");
      }

      if (i + 1 === nextWordEnd) {
        nextWordEnd += wordLengths[wordIndex++] || 0;
      }

      cell.addEventListener("click", () => {
        if (selectedIndex === null) {
          selectedIndex = i;
        } else if (selectedIndex === i) {
          selectedIndex = null;
        } else {
          const temp = letters[selectedIndex];
          letters[selectedIndex] = letters[i];
          letters[i] = temp;

          selectedIndex = null;
          checkWin();
        }
        render();
      });

      grid.appendChild(cell);
    });
  }

  function checkWin() {
    const correct = phraseNoSpaces.map(o => o.id);
    const current = letters.map(o => o.id);

    if (correct.join("") === current.join("")) {
      message.textContent = "🎉 Frase completata!";
    } else {
      message.textContent = "";
    }
  }

  document.getElementById("btn-shuffle").onclick = () => {
    shuffle();
    selectedIndex = null;
    render();
  };

  render();
</script>

</body>
</html>
